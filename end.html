<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Missão Concluída</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        background: radial-gradient(circle at center, #111827 0%, #020617 100%);

        overflow: auto;

        color: white;

        padding: 30px;
      }

      /* ========================================
   GRID FUTURISTA
======================================== */

      body::before {
        content: '';

        position: absolute;

        width: 200%;
        height: 200%;

        background: repeating-linear-gradient(
          90deg,
          transparent,
          transparent 80px,
          rgba(0, 255, 255, 0.03) 81px
        );

        animation: moverGrid 10s linear infinite;
      }

      @keyframes moverGrid {
        from {
          transform: translateX(0);
        }

        to {
          transform: translateX(-80px);
        }
      }

      /* ========================================
   CONTAINER
======================================== */

      .container {
        position: relative;

        z-index: 2;

        width: 100%;
        max-width: 1000px;

        text-align: center;

        padding: 20px;

        border-radius: 30px;

        background: rgba(255, 255, 255, 0.05);

        border: 1px solid rgba(255, 255, 255, 0.1);

        backdrop-filter: blur(12px);

        box-shadow: 0 0 40px rgba(0, 255, 255, 0.15);
      }

      /* ========================================
   TÍTULO
======================================== */

      h1 {
        font-size: 50px;

        margin-bottom: 15px;

        color: #22c55e;

        text-shadow: 0 0 10px #22c55e, 0 0 25px #22c55e;

        animation: pulsar 1.5s infinite alternate;
      }

      @keyframes pulsar {
        from {
          transform: scale(1);
        }

        to {
          transform: scale(1.03);
        }
      }

      /* ========================================
   TEXTO
======================================== */

      .descricao {
        font-size: 20px;

        line-height: 1.7;

        opacity: 0.9;

        margin-bottom: 15px;
      }

      /* ========================================
   IMAGEM
======================================== */

      .imagem-final {
        width: 100%;

        max-width: 480px;

        border-radius: 25px;

        border: 3px solid rgba(255, 255, 255, 0.1);

        box-shadow: 0 0 35px rgba(0, 255, 255, 0.25);

        margin-bottom: 15px;
      }

      /* ========================================
   TEXTO EXTRA
======================================== */

      .frase {
        font-size: 20px;

        color: #38bdf8;

        font-weight: bold;

        text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
      }

      .tempo-restante {
        margin-top: 30px;

        font-size: 36px;

        font-weight: bold;

        color: #22c55e;

        text-shadow: 0 0 10px rgba(34, 197, 94, 0.7);
      }

      /* ========================================
   RESPONSIVIDADE
======================================== */

      @media (max-width: 768px) {
        h1 {
          font-size: 38px;
        }

        .descricao {
          font-size: 20px;
        }

        .frase {
          font-size: 22px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- TÍTULO -->
      <h1 id="titulo"></h1>

      <!-- TEXTO -->
      <p class="descricao" id="descricao"></p>

      <!-- IMAGEM -->
      <img src="vitoria.png" class="imagem-final" id="imagemFinal" />

      <!-- FRASE FINAL -->
      <div class="frase" id="frase"></div>

      <!-- TEMPO RESTANTE -->
      <div class="tempo-restante" id="tempoRestante"></div>
    </div>

    <script>
      // ========================================
      // CONFIGURAÇÕES
      // ========================================

      const CONFIG = {
        titulo: 'MISSÃO CONCLUÍDA',

        descricao:
          'Parabéns! Vocês conseguiram restaurar a linha temporal e impedir o colapso do sistema.',

        frase:
          'O futuro foi salvo graças à inteligência e ao trabalho em equipe de vocês.',

        imagem: 'vitoria.png',
      };

      // ========================================
      // INICIALIZAÇÃO
      // ========================================

      document.getElementById('titulo').innerHTML = CONFIG.titulo;

      document.getElementById('descricao').innerHTML = CONFIG.descricao;

      document.getElementById('frase').innerHTML = CONFIG.frase;

      document.getElementById('imagemFinal').src = CONFIG.imagem;

      // ========================================
      // TEMPO RESTANTE
      // ========================================

      const tempoFinal = parseInt(localStorage.getItem('tempo_restante_final'));

      // VERIFICA SE EXISTE

      if (!isNaN(tempoFinal)) {
        let minutos = Math.floor(tempoFinal / 60);

        let segundos = tempoFinal % 60;

        minutos = String(minutos).padStart(2, '0');

        segundos = String(segundos).padStart(2, '0');

        document.getElementById(
          'tempoRestante'
        ).innerHTML = `⏱ TEMPO RESTANTE: ${minutos}:${segundos}`;
      }
    </script>
  </body>
</html>
