<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Módulo Temporal Restaurado</title>

    <style>
      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at center, #0d1b2a 0%, #000814 100%);
        color: white;
      }

      /* Fundo animado */

      body::before {
        content: '';
        position: absolute;
        width: 200%;
        height: 200%;
        background: repeating-linear-gradient(
            90deg,
            rgba(0, 255, 255, 0.03) 0px,
            rgba(0, 255, 255, 0.03) 1px,
            transparent 1px,
            transparent 80px
          ),
          repeating-linear-gradient(
            0deg,
            rgba(0, 255, 255, 0.03) 0px,
            rgba(0, 255, 255, 0.03) 1px,
            transparent 1px,
            transparent 80px
          );
        animation: moveGrid 20s linear infinite;
      }

      @keyframes moveGrid {
        from {
          transform: translate(0, 0);
        }
        to {
          transform: translate(-80px, -80px);
        }
      }

      /* Painel */

      .container {
        position: relative;
        z-index: 2;
        width: 90%;
        max-width: 700px;
        padding: 40px;
        border-radius: 25px;
        background: rgba(10, 20, 40, 0.85);
        border: 2px solid #00e5ff;
        box-shadow: 0 0 25px rgba(0, 229, 255, 0.5),
          0 0 60px rgba(0, 229, 255, 0.2);
        text-align: center;
        backdrop-filter: blur(6px);
      }

      /* Título */

      h1 {
        font-size: 2.4rem;
        color: #00e5ff;
        margin-bottom: 20px;
        text-shadow: 0 0 10px #00e5ff;
      }

      /* Texto */

      p {
        font-size: 1.2rem;
        line-height: 1.6;
        color: #d9faff;
      }

      /* Fragmento */

      .fragmento {
        margin-top: 30px;
        padding: 20px;
        border-radius: 15px;
        background: rgba(0, 229, 255, 0.08);
        border: 1px solid rgba(0, 229, 255, 0.4);
      }

      .codigo {
        font-size: 2rem;
        letter-spacing: 8px;
        margin-top: 10px;
        color: #7df9ff;
        text-shadow: 0 0 12px #7df9ff;
        font-weight: bold;
      }

      /* Botão */

      button {
        margin-top: 35px;
        padding: 15px 35px;
        font-size: 1rem;
        border: none;
        border-radius: 12px;
        background: #00e5ff;
        color: #001219;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
      }

      button:hover {
        transform: scale(1.05);
        background: #7df9ff;
      }

      /* Pequeno brilho */

      .glow {
        position: absolute;
        width: 300px;
        height: 300px;
        background: rgba(0, 229, 255, 0.15);
        filter: blur(100px);
        border-radius: 50%;
        top: -100px;
        right: -100px;
      }
    </style>
  </head>

  <body>
    <div class="glow"></div>

    <div class="container">
      <h1>MÓDULO B RESTAURADO</h1>

      <p>
        Excelente trabalho, agentes temporais.
        <br /><br />
        O segundo fragmento da linha do tempo foi estabilizado.
        <br />
        Mas a distorção temporal permanece...
        <br />
        Solicite os enigmas 5 e 6 para a proxima fase.
      </p>

      <div class="fragmento">
        <p>FRAGMENTO DA CIFRA DETECTADO</p>

        <div class="codigo">IT HXÑ</div>
      </div>

      <button
        onclick="window.location.href='https://eduescaperoom.com/enigma/s21LYEVovVYl'"
      >
        ACESSAR PRÓXIMO MÓDULO
      </button>
    </div>
  </body>
</html>
